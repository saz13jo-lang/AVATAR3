name: Update library
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch.mjs
        env: { TMDB_KEY: "${{ secrets.TMDB_KEY }}", RAWG_KEY: "${{ secrets.RAWG_KEY }}" }
      - run: |
          git config user.name "avatar-hub-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/library.json; git diff --cached --quiet || (git commit -m "update library" && git push)
