<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVATAR HUB</title>
<style>
:root{color-scheme:dark;--bg:#04060c;--sf:#0a1120;--ln:#17274a;--bl:#2f6bff;--gl:#6ea0ff;--mu:#8a9bc0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#0d2a6b55,transparent 70%),var(--bg);color:#e8eefc;font-family:system-ui,Tahoma,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:12px 20px;background:#04060cdd;backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.logo{font-weight:700;letter-spacing:.1em;direction:ltr;text-shadow:0 0 18px #2f6bffaa}nav{display:flex;gap:4px;flex:1;overflow-x:auto}nav a{padding:5px 12px;border-radius:99px;color:var(--mu);white-space:nowrap}nav a.on,nav a:hover{background:#0f1a30;color:#fff}
.btn{border:1px solid var(--ln);background:var(--sf);padding:6px 12px;border-radius:10px;cursor:pointer}.btn:hover{border-color:var(--bl)}.btn.on{background:#13244a}
main{max-width:1180px;margin:auto;padding:24px 20px 70px}h1{font-size:clamp(2rem,5vw,3.4rem);margin:20px 0 6px}h2{margin:30px 0 12px}
.q{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 16px;margin:14px 0}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.strip .c{flex:0 0 160px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.grid.b{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.c{position:relative;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--sf);transition:.2s}.c:hover{border-color:var(--bl);box-shadow:0 6px 26px #2f6bff44}
.c img{display:block;width:100%;aspect-ratio:1;object-fit:cover;object-position:top}.b .c img{aspect-ratio:16/9;object-position:center}
.c small{display:block;padding:6px 10px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.act{display:flex;gap:4px;padding:6px;flex-wrap:wrap}.act .btn{padding:3px 9px;font-size:.85rem}
.empty{border:1px dashed var(--ln);border-radius:14px;padding:22px;color:var(--mu);background:var(--sf)}.err{color:#f5b942}
textarea,select{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px;margin:6px 0}
#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bl);padding:7px 16px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none}#t.s{opacity:1}
footer{color:var(--mu);font-size:.85rem;padding:20px;text-align:center}
</style></head><body>
<header><a class="logo" href="#">AVATAR HUB</a><nav id="nav"></nav><button class="btn" id="lg">EN</button></header>
<main id="app"></main><div id="t"></div><footer>Data and images: TMDB (this product uses the TMDB API but is not endorsed or certified by TMDB), RAWG, AniList. Each image links to its source. صور ملك لأصحابها.</footer>
<script>
const D={ar:{home:"الرئيسية",fav:"المفضلة",col:"التجميعات",pub:"Discord",st:"الحالة",h:"أفتارات وبنرات حقيقية",s:"ابحث باسم شخصية أو عمل",movie:"أفلام",tv:"مسلسلات",game:"ألعاب",anime:"أنمي",av:"Avatars",bn:"Banners",dl:"تنزيل",cp:"نسخ الرابط",sv:"حفظ",src:"المصدر",none:"لا توجد صور من هذا النوع لهذا العمل.",nodata:"لا توجد بيانات بعد. شغّل التحديث من تبويب Actions في GitHub (راجع README).",nores:"لا نتائج.",upd:"آخر تحديث ناجح",nvr:"لم يحدث",cc:"تم النسخ",pm:"نسخ الرسالة",ld:"فشل التحميل المباشر، فتحت الصورة الأصلية.",favE:"لا شيء محفوظ.",sel:"اختر تجميعة",lat:"أحدث الصور",bnr:"البنرات الأحدث"},
en:{home:"Home",fav:"Favorites",col:"Collections",pub:"Discord",st:"Status",h:"Real avatars & banners",s:"Search a character or title",movie:"Movies",tv:"Series",game:"Games",anime:"Anime",av:"Avatars",bn:"Banners",dl:"Download",cp:"Copy link",sv:"Save",src:"Source",none:"No images of this type for this title.",nodata:"No data yet. Run the update from the GitHub Actions tab (see README).",nores:"No results.",upd:"Last successful update",nvr:"Never",cc:"Copied",pm:"Copy message",ld:"Direct download failed; opened the original.",favE:"Nothing saved.",sel:"Pick a collection",lat:"Latest images",bnr:"Latest banners"}};
let L=localStorage.lg||"ar",DB={items:[],status:{},updated:null},fav=JSON.parse(localStorage.fav||"[]");const $=s=>document.querySelector(s),t=()=>D[L],K=["movie","tv","game","anime"];
const toast=m=>{const e=$("#t");e.textContent=m;e.className="s";setTimeout(()=>e.className="",1500)},cp=s=>navigator.clipboard.writeText(s).then(()=>toast(t().cc),()=>toast("—")),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const imgs=()=>DB.items.flatMap(e=>e.images.map((i,n)=>({...i,e,n,key:e.id+"|"+n,wide:i.w/i.h>=1.5})));
const card=(i,sq)=>`<div class="c"><a href="#e/${i.e.id}"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(i.thumb)}" alt="${esc(i.e.name)}"></a><small>${esc(i.e.name)}</small>${sq?"":`<div class="act"><button class="btn" data-d="${i.key}">${t().dl}</button><button class="btn" data-c="${i.key}">${t().cp}</button><button class="btn" data-f="${i.key}">${fav.includes(i.key)?"★":"☆"} ${t().sv}</button></div>`}</div>`;
const byKey=k=>imgs().find(i=>i.key===k);
async function dl(i,sq){try{const im=new Image();im.crossOrigin="anonymous";await new Promise((a,b)=>{im.onload=a;im.onerror=b;im.src=i.full});let w=im.naturalWidth,h=im.naturalHeight,s=sq?Math.min(w,h):0,c=document.createElement("canvas");c.width=s||w;c.height=s||h;c.getContext("2d").drawImage(im,s?(w-s)/2:0,0,s||w,s||h,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.95)),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=i.e.name.replace(/\W+/g,"_")+".jpg";a.click()}catch{window.open(i.full,"_blank");toast(t().ld)}}
function bind(){document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const i=byKey(b.dataset.d);dl(i,!i.wide&&!b.closest(".b")?false:b.closest(".b")?false:true)});document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>cp(byKey(b.dataset.c).full));document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const k=b.dataset.f,x=fav.indexOf(k);x>-1?fav.splice(x,1):fav.push(k);localStorage.fav=JSON.stringify(fav);b.textContent=(x>-1?"☆ ":"★ ")+t().sv})}
function res(q){const x=q.toLowerCase();const r=DB.items.filter(e=>(e.name+" "+e.work).toLowerCase().includes(x));$("#r").innerHTML=r.length?`<div class="grid">${r.map(e=>card({...e.images[0],e,n:0,key:e.id+"|0"},1)).join("")}</div>`:`<div class="empty">${t().nores}</div>`}
const cols=()=>{const a=imgs();return[{n:t().lat,l:a.sort((x,y)=>(y.e.added||"").localeCompare(x.e.added||"")).slice(0,20)},{n:t().bnr,l:imgs().filter(i=>i.wide).slice(-20).reverse()},...K.map(k=>({n:t()[k],l:imgs().filter(i=>i.e.kind===k).slice(0,20)}))].filter(c=>c.l.length)};
function render(){const h=location.hash.slice(1),tt=t();document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";$("#lg").textContent=L=="ar"?"EN":"AR";
$("#nav").innerHTML=[["",tt.home],["fav",tt.fav],["col",tt.col],["pub",tt.pub],["st",tt.st]].map(x=>`<a href="#${x[0]}" class="${h==x[0]?"on":""}">${x[1]}</a>`).join("");let o="";
if(!DB.items.length&&h!="st")o=`<h1>AVATAR HUB</h1><div class="empty">${tt.nodata}</div>`;
else if(h.startsWith("e/")){const e=DB.items.find(x=>x.id==h.slice(2));if(!e){o=`<div class="empty">${tt.nores}</div>`}else{const a=imgs().filter(i=>i.e==e),av=a.filter(i=>!i.wide),bn=a.filter(i=>i.wide);o=`<h1>${esc(e.name)}</h1><p>${esc(e.work)} — ${tt.src}: <a href="${esc(e.sourceUrl)}" target="_blank" rel="noopener" style="color:var(--gl)">${e.source}</a></p><h2>${tt.av}</h2>${av.length?`<div class="grid">${av.map(i=>card(i)).join("")}</div>`:`<div class="empty">${tt.none}</div>`}<h2>${tt.bn}</h2>${bn.length?`<div class="grid b">${bn.map(i=>card(i)).join("")}</div>`:`<div class="empty">${tt.none}</div>`}`}}
else if(h=="fav"){const a=fav.map(byKey).filter(Boolean);o=`<h2>${tt.fav}</h2>${a.length?`<div class="grid">${a.map(i=>card(i)).join("")}</div>`:`<div class="empty">${tt.favE}</div>`}`}
else if(h=="col"){o=cols().map(c=>`<h2>${c.n}</h2><div class="grid">${c.l.map(i=>card(i,1)).join("")}</div>`).join("")}
else if(h=="pub"){const c=cols();o=`<h2>Discord Publisher</h2><select id="ps"><option value="">${tt.sel}</option>${c.map((x,n)=>`<option value="${n}">${x.n}</option>`).join("")}</select><textarea id="pm" rows="12"></textarea><button class="btn" id="pc">${tt.pm}</button>`}
else if(h=="st"){const s=DB.status;o=`<h2>${tt.st}</h2><p>${tt.upd}: ${DB.updated?new Date(DB.updated).toLocaleString():tt.nvr}</p>${Object.entries(s).map(([k,v])=>`<div class="empty">${tt[k]||k}: ${v.ok?"✓ "+v.count:`<span class="err">${esc(v.error)}</span>`}</div>`).join("")}`}
else{o=`<h1>${tt.h}</h1><input class="q" id="q" placeholder="${tt.s}"><div id="r"></div>`+K.map(k=>{const l=DB.items.filter(e=>e.kind==k);return l.length?`<h2>${tt[k]}</h2><div class="strip">${l.map(e=>card({...e.images[0],e,n:0,key:e.id+"|0"},1)).join("")}</div>`:""}).join("")}
$("#app").innerHTML=o;bind();if($("#q"))$("#q").oninput=e=>e.target.value?res(e.target.value):$("#r").innerHTML="";
if($("#ps"))$("#ps").onchange=e=>{const c=cols()[e.target.value];$("#pm").value=c?`**${c.n}**\n\n`+c.l.slice(0,10).map(i=>`${i.e.name} — ${i.full}`).join("\n")+`\n\n${tt.src}: `+[...new Set(c.l.map(i=>i.e.source))].join(", "):""};if($("#pc"))$("#pc").onclick=()=>cp($("#pm").value)}
$("#lg").onclick=()=>{L=L=="ar"?"en":"ar";localStorage.lg=L;render()};addEventListener("hashchange",render);
fetch("data/library.json",{cache:"no-store"}).then(r=>r.json()).then(d=>DB=d).catch(()=>{}).finally(render);
</script></body></html>
